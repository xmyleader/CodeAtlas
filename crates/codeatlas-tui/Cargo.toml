[package]
name = "codeatlas-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
codeatlas-core = { path = "../codeatlas-core" }
crossterm = "0.28"
ratatui = { version = "0.29", default-features = false, features = [
    "crossterm",
    "unstable-rendered-line-info",
] }
serde = { version = "1", features = ["derive"] }
syntect = { version = "5.3", default-features = false, features = [
    "default-themes",
] }
thiserror = "2"
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
